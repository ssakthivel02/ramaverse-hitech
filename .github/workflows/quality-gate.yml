name: RamaVerse Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production source neutrality guard
        shell: bash
        run: |
          set -euo pipefail
          files=(vite.config.ts render.yaml server/_core/index.ts server/_core/llm.ts server/_core/sdk.ts server/_core/oauth.ts client/src/const.ts client/src/pages/SargaReader.tsx)
          if grep -En -i "forge\.manus\.im|vite-plugin-manus-runtime|manuspre\.computer|manus\.computer|manus-asia\.computer|manuscomputer\.ai|manusvm\.computer|WebDevAuthPublicService|/app-auth|OAUTH_SERVER_URL|types/manusTypes" "${files[@]}"; then
            echo "Forbidden Manus/Forge/WebDev coupling detected in production-critical RamaVerse source."
            exit 1
          fi

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deployable artifact neutrality guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn -i "forge\.manus\.im|vite-plugin-manus-runtime|manuspre\.computer|manus\.computer|manus-asia\.computer|manuscomputer\.ai|manusvm\.computer|BUILT_IN_FORGE|WebDevAuthPublicService|/app-auth|OAUTH_SERVER_URL|types/manusTypes|/manus-storage/|/__manus__/" dist; then
            echo "Forbidden Manus/Forge/WebDev marker found in deployable RamaVerse dist output."
            exit 1
          fi

      - name: Built-server health smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=3210 NODE_ENV=production node dist/index.js >/tmp/ramaverse-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3210/healthz >/tmp/ramaverse-health.json; then
              cat /tmp/ramaverse-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ramaverse-server.log
          exit 1
