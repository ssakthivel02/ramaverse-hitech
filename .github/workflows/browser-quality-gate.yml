name: RamaVerse Browser Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned browser-test tooling without changing the lockfile
        run: pnpm add --ignore-workspace-root-check --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production artifact
        run: pnpm build

      - name: Browser E2E and accessibility
        run: pnpm exec playwright test
