name: RamaVerse Integration Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.RAMAVERSE_TEST_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require dedicated test database
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "RAMAVERSE_TEST_DATABASE_URL is not configured. Integration tests are intentionally not pointed at production by default."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Canonical database tests
        run: pnpm vitest run server/sargas.test.ts server/canonicalSurfaceAudit.test.ts server/grounding.test.ts
