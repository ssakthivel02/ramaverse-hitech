name: RamaVerse Integration Gate

on:
  workflow_dispatch:
    inputs:
      provider_candidate:
        description: "Exact provider candidate validated through preflight and schema setup"
        required: true
        type: string
      schema_setup_run_id:
        description: "Successful RamaVerse Preview DB Setup workflow run ID for this exact commit/provider"
        required: true
        type: string
      confirm_canonical_reader_data_loaded:
        description: "I confirm only owner-approved canonical Reader data has been loaded and is ready for live integration verification"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.RAMAVERSE_TEST_DATABASE_URL }}
      DATABASE_CA_CERT_B64: ${{ secrets.RAMAVERSE_PREVIEW_DATABASE_CA_CERT_B64 || secrets.AIVEN_MYSQL_CA_CERT_B64 }}
      DATABASE_EXPECTED_NAME: ramaverse_preview
      DATABASE_EXPECTED_HOST: ${{ secrets.RAMAVERSE_PREVIEW_DATABASE_HOST }}
      DATABASE_REQUIRE_TLS: "true"
      PROVIDER_CANDIDATE: ${{ inputs.provider_candidate }}
      SCHEMA_SETUP_RUN_ID: ${{ inputs.schema_setup_run_id }}
      CANONICAL_READER_DATA_CONFIRMED: ${{ inputs.confirm_canonical_reader_data_loaded }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require schema evidence and canonical data confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CANONICAL_READER_DATA_CONFIRMED}" != "true" ]; then
            echo "Explicit confirmation of owner-approved canonical Reader data is required."
            exit 1
          fi
          if [ -z "${PROVIDER_CANDIDATE:-}" ]; then
            echo "provider_candidate is required."
            exit 1
          fi
          if ! [[ "${SCHEMA_SETUP_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "schema_setup_run_id must be a numeric GitHub Actions run ID."
            exit 1
          fi

      - name: Verify matching schema setup evidence
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SCHEMA_SETUP_RUN_ID}")"
          echo "${run_json}" | jq -e \
            --arg sha "${GITHUB_SHA}" \
            '.name == "RamaVerse Preview DB Setup" and
             .path == ".github/workflows/preview-db-setup.yml" and
             .event == "workflow_dispatch" and
             .head_sha == $sha and
             .status == "completed" and
             .conclusion == "success"' >/dev/null || {
              echo "Schema setup run is not a successful RamaVerse Preview DB Setup for this exact commit."
              exit 1
            }

          rm -rf schema-evidence
          mkdir -p schema-evidence
          gh run download "${SCHEMA_SETUP_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "preview-schema-setup-${GITHUB_SHA}" \
            --dir schema-evidence

          evidence_file="schema-evidence/preview-schema-setup-evidence.json"
          if [ ! -f "${evidence_file}" ]; then
            echo "Expected schema setup evidence artifact is missing."
            exit 1
          fi

          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg provider "${PROVIDER_CANDIDATE}" \
            --arg host "${DATABASE_EXPECTED_HOST}" \
            '.repository == $repository and
             .commit == $sha and
             .provider_candidate == $provider and
             .database_host == ($host | ascii_downcase) and
             .database_name == "ramaverse_preview" and
             .schema_mutation_approved == true and
             .schema_push_performed == true and
             .reader_data_verified == false and
             .result == "PREVIEW_SCHEMA_SETUP_PASS"' \
            "${evidence_file}" >/dev/null || {
              echo "Schema setup evidence does not match this repository/commit/provider/host or expected schema-only state."
              exit 1
            }

          echo "RamaVerse matching schema setup evidence PASS"

      - name: Require isolated verified preview database
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "RAMAVERSE_TEST_DATABASE_URL is not configured."
            exit 1
          fi
          if [ -z "${DATABASE_EXPECTED_HOST:-}" ]; then
            echo "RAMAVERSE_PREVIEW_DATABASE_HOST is not configured."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const url = new URL(process.env.DATABASE_URL);
          if (url.protocol !== 'mysql:') throw new Error('RamaVerse integration DATABASE_URL must use mysql://.');
          const actualHost = url.hostname.toLowerCase();
          const expectedHost = process.env.DATABASE_EXPECTED_HOST.trim().toLowerCase();
          if (actualHost !== expectedHost) throw new Error(`RamaVerse integration host identity mismatch. Expected ${expectedHost}, received ${actualHost}.`);
          if (actualHost.includes('hitech-preview-mysql')) throw new Error('Known shared cross-project database service is prohibited for RamaVerse preview integration.');
          const database = decodeURIComponent(url.pathname.replace(/^\//, ''));
          if (database !== process.env.DATABASE_EXPECTED_NAME) throw new Error(`RamaVerse integration must target ${process.env.DATABASE_EXPECTED_NAME}; received ${database || '<none>'}.`);
          const caB64 = process.env.DATABASE_CA_CERT_B64?.trim();
          if (actualHost.endsWith('.aivencloud.com') && !caB64) throw new Error('Aiven integration requires the trusted provider CA certificate.');
          console.log('RamaVerse provider-neutral integration database identity guard PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Verify database connectivity over trusted TLS
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import mysql from 'mysql2/promise';
          const url = new URL(process.env.DATABASE_URL);
          const caB64 = process.env.DATABASE_CA_CERT_B64?.trim();
          const ssl = { rejectUnauthorized: true, minVersion: 'TLSv1.2', ...(caB64 ? { ca: Buffer.from(caB64, 'base64').toString('utf8') } : {}) };
          const connection = await mysql.createConnection({
            host: url.hostname,
            port: url.port ? Number(url.port) : 3306,
            user: decodeURIComponent(url.username),
            password: decodeURIComponent(url.password),
            database: decodeURIComponent(url.pathname.replace(/^\//, '')),
            ssl,
          });
          const [rows] = await connection.query('SELECT DATABASE() AS db, 1 AS ok');
          await connection.end();
          if (!Array.isArray(rows) || rows[0]?.ok !== 1 || rows[0]?.db !== process.env.DATABASE_EXPECTED_NAME) process.exit(1);
          console.log('RamaVerse integration database verified-TLS connectivity PASS');
          NODE

      - name: Canonical database tests
        run: pnpm vitest run server/sargas.test.ts server/canonicalSurfaceAudit.test.ts server/grounding.test.ts
