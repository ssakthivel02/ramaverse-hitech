name: RamaVerse Integration Gate

on:
  workflow_dispatch:
    inputs:
      provider_candidate:
        description: "Exact provider candidate validated through preflight and schema setup"
        required: true
        type: string
      schema_setup_run_id:
        description: "Successful RamaVerse Preview DB Setup workflow run ID for this exact commit/provider"
        required: true
        type: string
      confirm_canonical_reader_data_loaded:
        description: "I confirm only owner-approved canonical Reader data has been loaded and is ready for live integration verification"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.RAMAVERSE_TEST_DATABASE_URL }}
      DATABASE_CA_CERT_B64: ${{ secrets.RAMAVERSE_PREVIEW_DATABASE_CA_CERT_B64 || secrets.AIVEN_MYSQL_CA_CERT_B64 }}
      DATABASE_EXPECTED_NAME: ramaverse_preview
      DATABASE_EXPECTED_HOST: ${{ secrets.RAMAVERSE_PREVIEW_DATABASE_HOST }}
      DATABASE_REQUIRE_TLS: "true"
      PROVIDER_CANDIDATE: ${{ inputs.provider_candidate }}
      SCHEMA_SETUP_RUN_ID: ${{ inputs.schema_setup_run_id }}
      CANONICAL_READER_DATA_CONFIRMED: ${{ inputs.confirm_canonical_reader_data_loaded }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require schema evidence and canonical data confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CANONICAL_READER_DATA_CONFIRMED}" != "true" ]; then
            echo "Explicit confirmation of owner-approved canonical Reader data is required."
            exit 1
          fi
          if [ -z "${PROVIDER_CANDIDATE:-}" ]; then
            echo "provider_candidate is required."
            exit 1
          fi
          if ! [[ "${SCHEMA_SETUP_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "schema_setup_run_id must be a numeric GitHub Actions run ID."
            exit 1
          fi

      - name: Verify matching schema setup evidence
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SCHEMA_SETUP_RUN_ID}")"
          echo "${run_json}" | jq -e --arg sha "${GITHUB_SHA}" '.name == "RamaVerse Preview DB Setup" and .path == ".github/workflows/preview-db-setup.yml" and .event == "workflow_dispatch" and .head_sha == $sha and .status == "completed" and .conclusion == "success"' >/dev/null || exit 1
          rm -rf schema-evidence && mkdir -p schema-evidence
          gh run download "${SCHEMA_SETUP_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "preview-schema-setup-${GITHUB_SHA}" --dir schema-evidence
          evidence_file="schema-evidence/preview-schema-setup-evidence.json"
          test -f "${evidence_file}"
          jq -e --arg repository "${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA}" --arg provider "${PROVIDER_CANDIDATE}" --arg host "${DATABASE_EXPECTED_HOST}" '.repository == $repository and .commit == $sha and .provider_candidate == $provider and .database_host == ($host | ascii_downcase) and .database_name == "ramaverse_preview" and .schema_mutation_approved == true and .schema_push_performed == true and .reader_data_verified == false and .result == "PREVIEW_SCHEMA_SETUP_PASS"' "${evidence_file}" >/dev/null

      - name: Require isolated verified preview database
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          test -n "${DATABASE_EXPECTED_HOST:-}"
          node --input-type=module <<'NODE'
          const url = new URL(process.env.DATABASE_URL);
          const actualHost = url.hostname.toLowerCase();
          const expectedHost = process.env.DATABASE_EXPECTED_HOST.trim().toLowerCase();
          if (url.protocol !== 'mysql:') throw new Error('RamaVerse integration DATABASE_URL must use mysql://.');
          if (actualHost !== expectedHost) throw new Error('RamaVerse integration host identity mismatch.');
          if (actualHost.includes('hitech-preview-mysql')) throw new Error('Known shared cross-project database service is prohibited.');
          const database = decodeURIComponent(url.pathname.replace(/^\//, ''));
          if (database !== process.env.DATABASE_EXPECTED_NAME) throw new Error('Unexpected RamaVerse database identity.');
          const caB64 = process.env.DATABASE_CA_CERT_B64?.trim();
          if (actualHost.endsWith('.aivencloud.com') && !caB64) throw new Error('Aiven integration requires the trusted provider CA certificate.');
          NODE

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Verify database connectivity over trusted TLS
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import mysql from 'mysql2/promise';
          const url = new URL(process.env.DATABASE_URL);
          const caB64 = process.env.DATABASE_CA_CERT_B64?.trim();
          const ssl = { rejectUnauthorized: true, minVersion: 'TLSv1.2', ...(caB64 ? { ca: Buffer.from(caB64, 'base64').toString('utf8') } : {}) };
          const connection = await mysql.createConnection({ host: url.hostname, port: url.port ? Number(url.port) : 3306, user: decodeURIComponent(url.username), password: decodeURIComponent(url.password), database: decodeURIComponent(url.pathname.replace(/^\//, '')), ssl });
          const [rows] = await connection.query('SELECT DATABASE() AS db, 1 AS ok');
          await connection.end();
          if (!Array.isArray(rows) || rows[0]?.ok !== 1 || rows[0]?.db !== process.env.DATABASE_EXPECTED_NAME) process.exit(1);
          NODE

      - name: Canonical database tests
        run: pnpm vitest run server/sargas.test.ts server/canonicalSurfaceAudit.test.ts server/grounding.test.ts

      - name: Create live integration evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          host="$(node --input-type=module -e "console.log(new URL(process.env.DATABASE_URL).hostname.toLowerCase())")"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg provider "${PROVIDER_CANDIDATE}" \
            --arg database_host "${host}" \
            --arg schema_setup_run_id "${SCHEMA_SETUP_RUN_ID}" \
            '{repository:$repository,commit:$commit,provider_candidate:$provider,database_host:$database_host,database_name:"ramaverse_preview",schema_setup_run_id:$schema_setup_run_id,canonical_reader_data_confirmed:true,canonical_database_tests_passed:true,result:"LIVE_INTEGRATION_PASS"}' \
            > integration-evidence/live-integration-evidence.json

      - name: Upload live integration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-integration-${{ github.sha }}
          path: integration-evidence/live-integration-evidence.json
          if-no-files-found: error
          retention-days: 30
