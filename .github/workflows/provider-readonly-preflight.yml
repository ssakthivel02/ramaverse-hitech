name: RamaVerse Provider Read-Only Preflight

on:
  workflow_dispatch:
    inputs:
      provider_candidate:
        description: "Exact dedicated preview provider candidate"
        required: true
        type: string
      provider_selection_run_id:
        description: "Successful RamaVerse Provider Candidate Selection run ID for this exact candidate"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  readonly-provider-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.RAMAVERSE_TEST_DATABASE_URL }}
      DATABASE_EXPECTED_NAME: ramaverse_preview
      DATABASE_EXPECTED_HOST: ${{ secrets.RAMAVERSE_PREVIEW_DATABASE_HOST }}
      DATABASE_CA_CERT_B64: ${{ secrets.RAMAVERSE_PREVIEW_DATABASE_CA_CERT_B64 }}
      PROVIDER_CANDIDATE: ${{ inputs.provider_candidate }}
      PROVIDER_SELECTION_RUN_ID: ${{ inputs.provider_selection_run_id }}
    steps:
      - name: Validate provider selection request
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROVIDER_CANDIDATE:-}" || { echo "A provider candidate must be selected explicitly."; exit 1; }
          [[ "$PROVIDER_SELECTION_RUN_ID" =~ ^[0-9]+$ ]] || { echo "provider_selection_run_id must be numeric."; exit 1; }

      - name: Verify provider candidate selection run and evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PROVIDER_SELECTION_RUN_ID}" > /tmp/provider-selection-run.json
          jq -e '.name == "RamaVerse Provider Candidate Selection" and .conclusion == "success"' /tmp/provider-selection-run.json >/dev/null || {
            echo "Provider selection run is not a successful RamaVerse Provider Candidate Selection run."; exit 1;
          }

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PROVIDER_SELECTION_RUN_ID}/artifacts?per_page=100" > /tmp/provider-selection-artifacts.json
          artifact_id="$(jq -r '.artifacts[] | select(.expired == false and (.name | startswith("provider-candidate-selection-evidence-"))) | .id' /tmp/provider-selection-artifacts.json | head -n1)"
          test -n "$artifact_id" || { echo "PROVIDER_CANDIDATE_SELECTION_APPROVED artifact not found or expired."; exit 1; }

          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/provider-selection.zip
          mkdir -p /tmp/provider-selection-evidence
          unzip -q /tmp/provider-selection.zip -d /tmp/provider-selection-evidence
          evidence="$(find /tmp/provider-selection-evidence -type f -name '*.json' | head -n1)"
          test -n "$evidence" || { echo "Provider selection evidence JSON not found."; exit 1; }

          jq -e --arg repository "$GITHUB_REPOSITORY" --arg provider "$PROVIDER_CANDIDATE" '
            .result == "PROVIDER_CANDIDATE_SELECTION_APPROVED" and
            .repository == $repository and
            .provider_candidate == $provider and
            .owner_provider_candidate_approval == true and
            .selection_scope == "live_preview_candidate_validation_only" and
            .provisioning_performed == false and
            .database_connection_performed == false and
            .database_mutation_performed == false and
            .provider_mutation_performed == false and
            .deployment_performed == false and
            .production_ready == false and
            .production_dns_change_allowed == false and
            .production_deployment_change_allowed == false
          ' "$evidence" >/dev/null || {
            echo "Provider selection evidence does not match this repository/candidate or violates the validation-only boundary."; exit 1;
          }
          echo "Provider candidate selection evidence PASS for ${PROVIDER_CANDIDATE}."

      - name: Checkout exact repository state
        uses: actions/checkout@v4

      - name: Require dedicated preview database identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "RAMAVERSE_TEST_DATABASE_URL is not configured."
            exit 1
          fi
          if [ -z "${DATABASE_EXPECTED_HOST:-}" ]; then
            echo "RAMAVERSE_PREVIEW_DATABASE_HOST is not configured."
            exit 1
          fi

          node --input-type=module <<'NODE'
          const url = new URL(process.env.DATABASE_URL);
          const actualHost = url.hostname.toLowerCase();
          const expectedHost = process.env.DATABASE_EXPECTED_HOST.trim().toLowerCase();
          const database = decodeURIComponent(url.pathname.replace(/^\//, ''));

          if (url.protocol !== 'mysql:') {
            throw new Error('RamaVerse preview DATABASE_URL must use mysql://.');
          }
          if (actualHost !== expectedHost) {
            throw new Error(`RamaVerse preview host identity mismatch. Expected ${expectedHost}, received ${actualHost}.`);
          }
          if (actualHost.includes('hitech-preview-mysql')) {
            throw new Error('Known shared cross-project database service is prohibited for RamaVerse preview.');
          }
          if (database !== process.env.DATABASE_EXPECTED_NAME) {
            throw new Error(`RamaVerse preview must target ${process.env.DATABASE_EXPECTED_NAME}; received ${database || '<none>'}.`);
          }

          console.log('RamaVerse dedicated database identity guard PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read-only verified-TLS provider probe
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import mysql from 'mysql2/promise';

          const url = new URL(process.env.DATABASE_URL);
          const caB64 = process.env.DATABASE_CA_CERT_B64?.trim();
          const ssl = {
            rejectUnauthorized: true,
            minVersion: 'TLSv1.2',
            ...(caB64 ? { ca: Buffer.from(caB64, 'base64').toString('utf8') } : {}),
          };

          const connection = await mysql.createConnection({
            host: url.hostname,
            port: url.port ? Number(url.port) : 3306,
            user: decodeURIComponent(url.username),
            password: decodeURIComponent(url.password),
            database: decodeURIComponent(url.pathname.replace(/^\//, '')),
            ssl,
          });

          try {
            const [identityRows] = await connection.query(
              'SELECT DATABASE() AS db, VERSION() AS server_version, @@version_comment AS version_comment'
            );
            const [sslRows] = await connection.query("SHOW STATUS LIKE 'Ssl%'");

            const identity = Array.isArray(identityRows) ? identityRows[0] : undefined;
            if (!identity || identity.db !== process.env.DATABASE_EXPECTED_NAME) {
              throw new Error('Database identity changed after verified-TLS connection.');
            }

            const sslStatus = new Map(
              (Array.isArray(sslRows) ? sslRows : []).map(row => [row.Variable_name, row.Value])
            );
            const cipher = sslStatus.get('Ssl_cipher');
            const tlsVersion = sslStatus.get('Ssl_version');
            if (!cipher) throw new Error('TLS verification failed: no negotiated SSL cipher reported.');
            if (!tlsVersion) throw new Error('TLS verification failed: no negotiated TLS version reported.');

            const evidence = {
              schema_version: 3,
              repository: process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              provider_candidate: process.env.PROVIDER_CANDIDATE,
              provider_selection_run_id: process.env.PROVIDER_SELECTION_RUN_ID,
              provider_selection_evidence_passed: true,
              owner_provider_candidate_approved: true,
              database: identity.db,
              server_version: String(identity.server_version ?? ''),
              version_comment: String(identity.version_comment ?? ''),
              ssl_cipher: String(cipher),
              tls_version: String(tlsVersion),
              mutation_performed: false,
              result: 'READ_ONLY_PROVIDER_PREFLIGHT_PASS',
            };

            fs.writeFileSync('provider-readonly-preflight-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);

            const summary = [
              '## RamaVerse provider read-only preflight',
              '',
              `- Result: ${evidence.result}`,
              `- Provider candidate: ${evidence.provider_candidate}`,
              `- Provider selection run: ${evidence.provider_selection_run_id}`,
              `- Provider selection evidence passed: ${evidence.provider_selection_evidence_passed}`,
              `- Owner candidate approval confirmed from upstream evidence: ${evidence.owner_provider_candidate_approved}`,
              `- Repository: ${evidence.repository}`,
              `- Commit: ${evidence.commit}`,
              `- Database: ${evidence.database}`,
              `- Server version: ${evidence.server_version}`,
              `- Version comment: ${evidence.version_comment}`,
              `- TLS version: ${evidence.tls_version}`,
              `- SSL cipher: ${evidence.ssl_cipher}`,
              '- Mutation performed: false',
              '',
              'This preflight proves an explicitly selected candidate plus connection identity/TLS only. It does not approve the provider for preview runtime, apply schema, load Reader data, or authorize preview deployment.',
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          } finally {
            await connection.end();
          }
          NODE

      - name: Upload non-secret preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: provider-readonly-preflight-${{ github.sha }}
          path: provider-readonly-preflight-evidence.json
          if-no-files-found: error
          retention-days: 30
