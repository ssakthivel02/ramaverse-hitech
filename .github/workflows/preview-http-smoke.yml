name: RamaVerse Preview HTTP Smoke

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "HTTPS base URL of the deployed RamaVerse preview"
        required: true
        type: string
      expected_commit:
        description: "Exact Git commit SHA expected to be running on the preview"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate preview inputs
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "preview_url must use HTTPS"; exit 1 ;;
          esac
          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_commit must be a full 40-character Git SHA"
            exit 1
          fi

      - name: Verify exact deployed release identity
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$base/releasez" | tee /tmp/release.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('/tmp/release.json', 'utf8'));
          const expected = process.env.EXPECTED_COMMIT.toLowerCase();
          if (release.service !== 'ramaverse') throw new Error('Wrong service identity from /releasez.');
          if (release.repository !== 'ssakthivel02/ramaverse-hitech') throw new Error(`Unexpected repository identity: ${String(release.repository)}`);
          if (release.exactCommitKnown !== true) throw new Error('Deployed RamaVerse commit identity is not available.');
          if (String(release.commit).toLowerCase() !== expected) {
            throw new Error(`Deployed commit ${String(release.commit)} does not match expected commit ${expected}.`);
          }
          console.log(`RamaVerse exact deployed commit PASS: ${expected}`);
          NODE

      - name: Verify live, ready and root surfaces
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$base/healthz" | tee /tmp/health.json
          curl --fail --silent --show-error --max-time 20 "$base/readyz" | tee /tmp/ready.json
          curl --fail --silent --show-error --max-time 20 "$base/" -o /tmp/root.html
          test -s /tmp/root.html

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const ready = JSON.parse(fs.readFileSync('/tmp/ready.json', 'utf8'));
          if (health.status !== 'alive' || health.service !== 'ramaverse') {
            throw new Error('RamaVerse /healthz payload is invalid.');
          }
          if (ready.status !== 'ready' || ready.service !== 'ramaverse') {
            throw new Error('RamaVerse /readyz did not report ready.');
          }
          if (ready.dependencies?.canonicalCorpus !== 'available') {
            throw new Error('RamaVerse canonical corpus is not available.');
          }
          if (ready.dependencies?.database !== 'configured') {
            throw new Error('RamaVerse preview database is not configured.');
          }
          if (!Number.isInteger(ready.canonicalCount) || ready.canonicalCount <= 0) {
            throw new Error('RamaVerse canonical corpus count is invalid.');
          }
          if (typeof ready.activeCorpusVersion !== 'string' || !ready.activeCorpusVersion) {
            throw new Error('RamaVerse active corpus version is missing.');
          }
          console.log('RamaVerse dependency readiness payload PASS');
          NODE

          if grep -Eqi "forge\.manus\.im|vite-plugin-manus-runtime|manuspre\.computer|manus\.computer|WebDevAuthPublicService|/__manus__/" /tmp/root.html; then
            echo "Legacy runtime marker found in deployed root HTML"
            exit 1
          fi

      - name: Verify baseline response headers
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"
          curl --fail --silent --show-error --head --max-time 20 "$base/" -o /tmp/headers.txt
          cat /tmp/headers.txt
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' /tmp/headers.txt
          grep -Eqi '^x-frame-options:[[:space:]]*SAMEORIGIN' /tmp/headers.txt
          grep -Eqi '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' /tmp/headers.txt
