name: RamaVerse Preview Release Candidate

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "data/**"
      - "release/preview-contract.json"
      - "render.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/preview-rc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Validate release contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c = JSON.parse(fs.readFileSync('release/preview-contract.json','utf8'));
          if (c.canonicalRepository !== process.env.GITHUB_REPOSITORY) throw new Error('Canonical repository mismatch');
          if (c.database?.expectedDatabase !== 'ramaverse_preview') throw new Error('Wrong preview database');
          if (c.database?.verifiedTlsRequired !== true) throw new Error('Verified TLS must remain required');
          if (c.deployment?.sourcePolicy !== 'exact-commit-only-after-green-gates') throw new Error('Exact-commit policy missing');
          if (c.production?.approved !== false) throw new Error('Preview contract cannot approve production');
          NODE

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Scan deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.js
          test -d dist/public
          if grep -REn -i "forge\.manus\.im|vite-plugin-manus-runtime|manuspre\.computer|manus\.computer|WebDevAuthPublicService|/app-auth|/__manus__/|/manus-storage/" dist; then
            echo "Forbidden legacy runtime marker found in release candidate output"
            exit 1
          fi

      - name: Create deterministic evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/evidence
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf release/evidence/ramaverse-preview-build.tgz dist
          contract_sha=$(sha256sum release/preview-contract.json | awk '{print $1}')
          build_sha=$(sha256sum release/evidence/ramaverse-preview-build.tgz | awk '{print $1}')
          node --input-type=module <<NODE
          import fs from 'node:fs';
          const contract = JSON.parse(fs.readFileSync('release/preview-contract.json','utf8'));
          const evidence = {
            schemaVersion: 1,
            application: 'ramaverse-hitech',
            environment: 'preview',
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            contractSha256: '${contract_sha}',
            buildArchiveSha256: '${build_sha}',
            databaseTarget: 'ramaverse_preview',
            runtimeReadiness: contract.runtimeReadiness,
            exactCommitRequired: true,
            productionApproved: false,
            generatedAt: new Date().toISOString()
          };
          fs.writeFileSync('release/evidence/preview-rc-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE
          cat release/evidence/preview-rc-evidence.json

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ramaverse-preview-rc-${{ github.sha }}
          path: release/evidence/
          if-no-files-found: error
          retention-days: 3
