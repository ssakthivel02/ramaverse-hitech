name: RamaVerse 0004 Disposable Migration Safety

on:
  pull_request:
    paths:
      - drizzle/**
      - migration-proposals/**
      - server/migration0004.disposable.live.test.ts
      - .github/workflows/migration-0004-disposable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-schema:
    name: mysql-${{ matrix.version }}-migration-0004
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: ci-only-not-a-real-secret
          MYSQL_DATABASE: ramaverse_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-not-a-real-secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      RAMAVERSE_DISPOSABLE_MIGRATION_0004: "true"
      RAMAVERSE_DISPOSABLE_DATABASE_URL: "mysql://root:ci-only-not-a-real-secret@127.0.0.1:3306/ramaverse_ci"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify historical row survives and no approval defaults exist
        run: pnpm exec vitest run server/migration0004.disposable.live.test.ts
