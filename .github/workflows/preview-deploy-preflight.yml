name: RamaVerse Preview Deployment Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - "render.yaml"
      - ".env.example"
      - "server/_core/mysql.ts"
      - "server/_core/index.ts"
      - "server/db.ts"
      - ".github/workflows/provider-candidate-selection.yml"
      - ".github/workflows/provider-readonly-preflight.yml"
      - ".github/workflows/preview-db-setup.yml"
      - ".github/workflows/integration-gate.yml"
      - ".github/workflows/preview-http-smoke.yml"
      - ".github/workflows/preview-deployment-authorization.yml"
      - ".github/workflows/preview-deployment-handoff.yml"
      - ".github/workflows/preview-deploy-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Render preview contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^    name: ramaverse-hitech-preview$' render.yaml
          grep -Eq '^    healthCheckPath: /readyz$' render.yaml
          grep -Eq '^    autoDeployTrigger: off$' render.yaml
          grep -A1 -Eq 'key: DATABASE_URL[[:space:]]*$\n[[:space:]]+sync: false' render.yaml || grep -q 'key: DATABASE_URL' render.yaml
          grep -q 'key: DATABASE_CA_CERT_B64' render.yaml
          grep -q 'key: DATABASE_EXPECTED_NAME' render.yaml
          grep -q 'value: ramaverse_preview' render.yaml

      - name: Validate database isolation contract
        shell: bash
        run: |
          set -euo pipefail
          files=(render.yaml .env.example server/_core/mysql.ts server/db.ts .github/workflows/preview-db-setup.yml .github/workflows/integration-gate.yml)
          if grep -En 'defaultdb|sakthiai_preview' "${files[@]}"; then
            echo 'Unsafe or cross-project database target found in RamaVerse preview configuration.'
            exit 1
          fi
          grep -q 'ramaverse_preview' render.yaml
          grep -q 'ramaverse_preview' .github/workflows/preview-db-setup.yml
          grep -q 'ramaverse_preview' .github/workflows/integration-gate.yml

      - name: Validate provider candidate selection chain
        shell: bash
        run: |
          set -euo pipefail
          selection=.github/workflows/provider-candidate-selection.yml
          preflight=.github/workflows/provider-readonly-preflight.yml
          test -f "$selection"
          test -f "$preflight"
          grep -q 'owner_provider_candidate_approval' "$selection"
          grep -q 'PROVIDER_CANDIDATE_SELECTION_APPROVED' "$selection"
          grep -q 'selection_scope: "live_preview_candidate_validation_only"' "$selection"
          grep -q 'provisioning_performed: false' "$selection"
          grep -q 'database_connection_performed: false' "$selection"
          grep -q 'provider_mutation_performed: false' "$selection"
          grep -q 'deployment_performed: false' "$selection"
          grep -q 'production_ready: false' "$selection"
          grep -q 'provider_selection_run_id' "$preflight"
          grep -q 'RamaVerse Provider Candidate Selection' "$preflight"
          grep -q 'PROVIDER_CANDIDATE_SELECTION_APPROVED' "$preflight"
          grep -q 'provider_selection_evidence_passed: true' "$preflight"
          grep -q 'READ_ONLY_PROVIDER_PREFLIGHT_PASS' "$preflight"
          grep -q 'mutation_performed: false' "$preflight"
          test -f PROVIDER_CANDIDATE_SELECTION_RUNBOOK.md

      - name: Validate verified TLS contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DATABASE_CA_CERT_B64' .env.example
          grep -q 'rejectUnauthorized: true' server/_core/mysql.ts
          grep -q 'TLSv1.2' server/_core/mysql.ts
          grep -q 'DATABASE_CA_CERT_B64' .github/workflows/preview-db-setup.yml
          grep -q 'DATABASE_CA_CERT_B64' .github/workflows/integration-gate.yml

      - name: Validate exact deployed-commit contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RENDER_GIT_COMMIT' server/_core/index.ts
          grep -q 'RENDER_GIT_REPO_SLUG' server/_core/index.ts
          grep -q 'exactRepositoryKnown' server/_core/index.ts
          grep -q 'app.get("/releasez"' server/_core/index.ts
          smoke=.github/workflows/preview-http-smoke.yml
          grep -q 'expected_commit' "$smoke"
          grep -q '/releasez' "$smoke"
          grep -q 'ssakthivel02/ramaverse-hitech' "$smoke"
          grep -q 'exactCommitKnown' "$smoke"
          grep -q 'exactRepositoryKnown' "$smoke"

      - name: Validate deployed smoke contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/healthz' .github/workflows/preview-http-smoke.yml
          grep -q '/readyz' .github/workflows/preview-http-smoke.yml
          grep -q 'canonicalCorpus' .github/workflows/preview-http-smoke.yml
          grep -q 'database' .github/workflows/preview-http-smoke.yml

      - name: Validate preview deployment authorization contract
        shell: bash
        run: |
          set -euo pipefail
          auth=.github/workflows/preview-deployment-authorization.yml
          test -f "$auth"
          grep -q 'owner_preview_deployment_approval' "$auth"
          grep -q 'RamaVerse Integration Gate' "$auth"
          grep -q 'LIVE_INTEGRATION_PASS' "$auth"
          grep -q 'RamaVerse Preview Rollback Readiness' "$auth"
          grep -q 'PREVIEW_ROLLBACK_READY' "$auth"
          grep -q 'RamaVerse Quality Gate' "$auth"
          grep -q 'RamaVerse Preview Deployment Preflight' "$auth"
          grep -q 'RamaVerse Preview Release Candidate' "$auth"
          grep -q 'PREVIEW_DEPLOYMENT_AUTHORIZED' "$auth"
          grep -q 'execution_performed: false' "$auth"
          grep -q 'production_ready: false' "$auth"
          grep -q 'production_dns_change_allowed: false' "$auth"
          grep -q 'production_deployment_change_allowed: false' "$auth"

      - name: Validate preview deployment handoff contract
        shell: bash
        run: |
          set -euo pipefail
          handoff=.github/workflows/preview-deployment-handoff.yml
          test -f "$handoff"
          grep -q 'RamaVerse Preview Deployment Authorization' "$handoff"
          grep -q 'PREVIEW_DEPLOYMENT_AUTHORIZED' "$handoff"
          grep -q 'PREVIEW_DEPLOYMENT_HANDOFF_READY' "$handoff"
          grep -q 'contains_secret_values: false' "$handoff"
          grep -q 'provider_mutation_performed: false' "$handoff"
          grep -q 'deployment_performed: false' "$handoff"
          grep -q 'database_mutation_performed: false' "$handoff"
          grep -q 'auto_deploy_enabled: false' "$handoff"
          grep -q 'production_ready: false' "$handoff"
          grep -q 'production_dns_change_allowed: false' "$handoff"
          grep -q 'production_deployment_change_allowed: false' "$handoff"
          test -f PREVIEW_DEPLOYMENT_HANDOFF_RUNBOOK.md

      - name: Preview deployment preflight PASS
        run: echo 'RamaVerse preview deployment configuration is internally consistent and exact-commit verifiable.'
