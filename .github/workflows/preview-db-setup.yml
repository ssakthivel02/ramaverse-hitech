name: RamaVerse Preview DB Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.RAMAVERSE_TEST_DATABASE_URL }}
      DATABASE_EXPECTED_NAME: ramaverse_preview
      DATABASE_EXPECTED_HOST: ${{ secrets.RAMAVERSE_PREVIEW_DATABASE_HOST }}
      DATABASE_EXPECTED_SERVICE_MARKER: ramaverse
      DATABASE_CA_CERT_B64: ${{ secrets.AIVEN_MYSQL_CA_CERT_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require preview database secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "RAMAVERSE_TEST_DATABASE_URL is not configured."
            exit 1
          fi
          if [ -z "${DATABASE_EXPECTED_HOST:-}" ]; then
            echo "RAMAVERSE_PREVIEW_DATABASE_HOST is not configured."
            exit 1
          fi
          if [ -z "${DATABASE_CA_CERT_B64:-}" ]; then
            echo "AIVEN_MYSQL_CA_CERT_B64 is not configured."
            exit 1
          fi

      - name: Validate dedicated Aiven MySQL target identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = new URL(process.env.DATABASE_URL);
          const actualHost = url.hostname.toLowerCase();
          const expectedHost = process.env.DATABASE_EXPECTED_HOST.trim().toLowerCase();
          const serviceMarker = process.env.DATABASE_EXPECTED_SERVICE_MARKER.trim().toLowerCase();

          if (url.protocol !== 'mysql:') throw new Error('RamaVerse preview DATABASE_URL must use mysql://.');
          if (!actualHost.endsWith('.aivencloud.com')) throw new Error('RamaVerse preview must target the approved Aiven MySQL host.');
          if (actualHost !== expectedHost) {
            throw new Error(`RamaVerse preview host identity mismatch. Expected ${expectedHost}, received ${actualHost}.`);
          }
          if (!actualHost.includes(serviceMarker)) {
            throw new Error(`RamaVerse preview host must carry the dedicated ${serviceMarker} service identity marker.`);
          }
          if (actualHost.includes('hitech-preview-mysql')) {
            throw new Error('Known shared cross-project Aiven service is prohibited for RamaVerse preview.');
          }

          const database = decodeURIComponent(url.pathname.replace(/^\//, ''));
          if (database !== process.env.DATABASE_EXPECTED_NAME) {
            throw new Error(`RamaVerse preview must target ${process.env.DATABASE_EXPECTED_NAME}, received ${database || '<none>'}.`);
          }
          console.log('RamaVerse dedicated Aiven MySQL target identity guard PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Apply preview schema only
        run: pnpm db:push

      - name: Verify database connectivity over trusted TLS
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import mysql from 'mysql2/promise';
          const url = new URL(process.env.DATABASE_URL);
          const connection = await mysql.createConnection({
            host: url.hostname,
            port: url.port ? Number(url.port) : 3306,
            user: decodeURIComponent(url.username),
            password: decodeURIComponent(url.password),
            database: decodeURIComponent(url.pathname.replace(/^\//, '')),
            ssl: {
              ca: Buffer.from(process.env.DATABASE_CA_CERT_B64, 'base64').toString('utf8'),
              rejectUnauthorized: true,
              minVersion: 'TLSv1.2',
            },
          });
          const [rows] = await connection.query('SELECT 1 AS ok');
          await connection.end();
          if (!Array.isArray(rows) || rows[0]?.ok !== 1) process.exit(1);
          console.log('RamaVerse preview verified-TLS database connectivity PASS');
          NODE

      - name: Reader-data boundary notice
        run: |
          echo "Schema setup does not assert canonical Reader data is loaded."
          echo "Run the separate RamaVerse Integration Gate only after an owner-approved lossless Sarga dataset has been loaded into this preview database."
