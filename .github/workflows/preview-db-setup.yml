name: RamaVerse Preview DB Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.RAMAVERSE_TEST_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require preview database secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "RAMAVERSE_TEST_DATABASE_URL is not configured."
            exit 1
          fi

      - name: Validate isolated Aiven MySQL target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const raw = process.env.DATABASE_URL;
          const url = new URL(raw);
          if (!['mysql:', 'mysql2:'].includes(url.protocol)) {
            throw new Error('RamaVerse preview DATABASE_URL must use MySQL.');
          }
          const database = url.pathname.replace(/^\//, '');
          if (database !== 'ramaverse_preview') {
            throw new Error(`RamaVerse preview must target database ramaverse_preview, received ${database || '<none>'}.`);
          }
          const sslMode = (url.searchParams.get('ssl-mode') || url.searchParams.get('sslmode') || '').toUpperCase();
          if (!['REQUIRED', 'VERIFY_CA', 'VERIFY_IDENTITY'].includes(sslMode)) {
            throw new Error('RamaVerse preview DATABASE_URL must require TLS (ssl-mode=REQUIRED or stronger).');
          }
          console.log('RamaVerse isolated MySQL/TLS target guard PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Apply preview schema only
        run: pnpm db:push

      - name: Verify database connectivity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import mysql from 'mysql2/promise';
          const connection = await mysql.createConnection(process.env.DATABASE_URL);
          const [rows] = await connection.query('SELECT 1 AS ok');
          await connection.end();
          if (!Array.isArray(rows) || rows[0]?.ok !== 1) process.exit(1);
          console.log('RamaVerse preview database connectivity PASS');
          NODE

      - name: Reader-data boundary notice
        run: |
          echo "Schema setup does not assert canonical Reader data is loaded."
          echo "Run the separate RamaVerse Integration Gate only after an owner-approved lossless Sarga dataset has been loaded into this preview database."
