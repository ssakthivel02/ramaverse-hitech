name: RamaVerse Preview DB Setup

on:
  workflow_dispatch:
    inputs:
      provider_candidate:
        description: "Exact provider candidate name used by the successful read-only preflight"
        required: true
        type: string
      preflight_run_id:
        description: "Successful RamaVerse Provider Read-Only Preflight workflow run ID for this exact commit/provider"
        required: true
        type: string
      confirm_schema_mutation:
        description: "I explicitly authorize schema-only mutation (pnpm db:push) after the matching preflight evidence is verified"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  schema-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.RAMAVERSE_TEST_DATABASE_URL }}
      DATABASE_EXPECTED_NAME: ramaverse_preview
      DATABASE_EXPECTED_HOST: ${{ secrets.RAMAVERSE_PREVIEW_DATABASE_HOST }}
      DATABASE_CA_CERT_B64: ${{ secrets.RAMAVERSE_PREVIEW_DATABASE_CA_CERT_B64 }}
      DATABASE_REQUIRE_TLS: "true"
      PROVIDER_CANDIDATE: ${{ inputs.provider_candidate }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      SCHEMA_MUTATION_APPROVED: ${{ inputs.confirm_schema_mutation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require explicit schema mutation approval
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SCHEMA_MUTATION_APPROVED}" != "true" ]; then
            echo "Explicit schema-only mutation approval is required before db:push."
            exit 1
          fi
          if [ -z "${PROVIDER_CANDIDATE:-}" ]; then
            echo "provider_candidate is required."
            exit 1
          fi
          if ! [[ "${PREFLIGHT_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "preflight_run_id must be a numeric GitHub Actions run ID."
            exit 1
          fi

      - name: Verify matching read-only preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
          echo "${run_json}" | jq -e \
            --arg sha "${GITHUB_SHA}" \
            '.name == "RamaVerse Provider Read-Only Preflight" and
             .path == ".github/workflows/provider-readonly-preflight.yml" and
             .event == "workflow_dispatch" and
             .head_sha == $sha and
             .status == "completed" and
             .conclusion == "success"' >/dev/null || {
              echo "Preflight run is not a successful RamaVerse read-only preflight for this exact commit."
              exit 1
            }

          rm -rf preflight-evidence
          mkdir -p preflight-evidence
          gh run download "${PREFLIGHT_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "provider-readonly-preflight-${GITHUB_SHA}" \
            --dir preflight-evidence

          evidence_file="preflight-evidence/provider-readonly-preflight-evidence.json"
          if [ ! -f "${evidence_file}" ]; then
            echo "Expected read-only preflight evidence artifact is missing."
            exit 1
          fi

          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg provider "${PROVIDER_CANDIDATE}" \
            '.repository == $repository and
             .commit == $sha and
             .provider_candidate == $provider and
             .owner_provider_candidate_approved == true and
             .mutation_performed == false and
             .result == "READ_ONLY_PROVIDER_PREFLIGHT_PASS"' \
            "${evidence_file}" >/dev/null || {
              echo "Preflight evidence does not match this repository/commit/provider or is not fail-closed read-only evidence."
              exit 1
            }

          echo "RamaVerse matching read-only provider preflight evidence PASS"

      - name: Require preview database identity secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "RAMAVERSE_TEST_DATABASE_URL is not configured."
            exit 1
          fi
          if [ -z "${DATABASE_EXPECTED_HOST:-}" ]; then
            echo "RAMAVERSE_PREVIEW_DATABASE_HOST is not configured."
            exit 1
          fi

      - name: Validate dedicated MySQL target identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = new URL(process.env.DATABASE_URL);
          const actualHost = url.hostname.toLowerCase();
          const expectedHost = process.env.DATABASE_EXPECTED_HOST.trim().toLowerCase();
          if (url.protocol !== 'mysql:') throw new Error('RamaVerse preview DATABASE_URL must use mysql://.');
          if (actualHost !== expectedHost) throw new Error(`RamaVerse preview host identity mismatch. Expected ${expectedHost}, received ${actualHost}.`);
          if (actualHost.includes('hitech-preview-mysql')) throw new Error('Known shared cross-project Aiven service is prohibited for RamaVerse preview.');
          const database = decodeURIComponent(url.pathname.replace(/^\//, ''));
          if (database !== process.env.DATABASE_EXPECTED_NAME) throw new Error(`RamaVerse preview must target ${process.env.DATABASE_EXPECTED_NAME}, received ${database || '<none>'}.`);
          console.log('RamaVerse dedicated MySQL target identity guard PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Apply preview schema only
        run: pnpm db:push

      - name: Verify database connectivity over trusted TLS
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import mysql from 'mysql2/promise';
          const url = new URL(process.env.DATABASE_URL);
          const caB64 = process.env.DATABASE_CA_CERT_B64?.trim();
          const isAiven = url.hostname.endsWith('.aivencloud.com');
          if (isAiven && !caB64) throw new Error('DATABASE_CA_CERT_B64 is required for verified TLS to Aiven MySQL.');
          const ssl = caB64
            ? { ca: Buffer.from(caB64, 'base64').toString('utf8'), rejectUnauthorized: true, minVersion: 'TLSv1.2' }
            : { rejectUnauthorized: true, minVersion: 'TLSv1.2' };
          const connection = await mysql.createConnection({
            host: url.hostname,
            port: url.port ? Number(url.port) : 3306,
            user: decodeURIComponent(url.username),
            password: decodeURIComponent(url.password),
            database: decodeURIComponent(url.pathname.replace(/^\//, '')),
            ssl,
          });
          const [rows] = await connection.query('SELECT 1 AS ok');
          await connection.end();
          if (!Array.isArray(rows) || rows[0]?.ok !== 1) process.exit(1);
          console.log('RamaVerse preview verified-TLS database connectivity PASS');
          NODE

      - name: Create schema setup evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const url = new URL(process.env.DATABASE_URL);
          const evidence = {
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            provider_candidate: process.env.PROVIDER_CANDIDATE,
            preflight_run_id: Number(process.env.PREFLIGHT_RUN_ID),
            database_host: url.hostname.toLowerCase(),
            database_name: decodeURIComponent(url.pathname.replace(/^\//, '')),
            schema_mutation_approved: process.env.SCHEMA_MUTATION_APPROVED === 'true',
            schema_push_performed: true,
            reader_data_verified: false,
            result: 'PREVIEW_SCHEMA_SETUP_PASS',
          };
          fs.writeFileSync('preview-schema-setup-evidence.json', JSON.stringify(evidence, null, 2));
          NODE

      - name: Upload schema setup evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-schema-setup-${{ github.sha }}
          path: preview-schema-setup-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Reader-data boundary notice
        run: |
          echo "Schema setup does not assert canonical Reader data is loaded."
          echo "Run the separate RamaVerse Integration Gate only after an owner-approved lossless Sarga dataset has been loaded into this preview database."
