name: RamaVerse Preview Rollback Readiness

on:
  workflow_dispatch:
    inputs:
      current_deployed_commit:
        description: "Exact 40-character Git SHA currently deployed to RamaVerse preview"
        required: true
        type: string
      rollback_target_commit:
        description: "Exact older 40-character Git SHA proposed as the preview rollback target"
        required: true
        type: string
      provider_candidate:
        description: "Exact dedicated preview provider candidate in use"
        required: true
        type: string
      rollback_reason:
        description: "Short non-secret reason for preparing rollback"
        required: true
        type: string
      owner_rollback_approval:
        description: "Owner explicitly approves preparing this preview rollback target"
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  rollback-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_DEPLOYED_COMMIT: ${{ inputs.current_deployed_commit }}
      ROLLBACK_TARGET_COMMIT: ${{ inputs.rollback_target_commit }}
      PROVIDER_CANDIDATE: ${{ inputs.provider_candidate }}
      ROLLBACK_REASON: ${{ inputs.rollback_reason }}
      OWNER_ROLLBACK_APPROVAL: ${{ inputs.owner_rollback_approval }}
    steps:
      - name: Validate rollback request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CURRENT_DEPLOYED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "current_deployed_commit must be a full 40-character Git SHA"; exit 1; }
          [[ "$ROLLBACK_TARGET_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "rollback_target_commit must be a full 40-character Git SHA"; exit 1; }
          test "$CURRENT_DEPLOYED_COMMIT" != "$ROLLBACK_TARGET_COMMIT" || { echo "Rollback target must differ from current deployed commit."; exit 1; }
          test -n "${PROVIDER_CANDIDATE:-}"
          test -n "${ROLLBACK_REASON:-}"
          test "$OWNER_ROLLBACK_APPROVAL" = "true" || { echo "Explicit owner rollback approval is required."; exit 1; }

      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify rollback target is older repository history
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${CURRENT_DEPLOYED_COMMIT}^{commit}"
          git cat-file -e "${ROLLBACK_TARGET_COMMIT}^{commit}"
          git merge-base --is-ancestor "$ROLLBACK_TARGET_COMMIT" "$CURRENT_DEPLOYED_COMMIT" || {
            echo "Rollback target is not an ancestor of the currently deployed commit."
            exit 1
          }

      - name: Verify target Quality Gate evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${ROLLBACK_TARGET_COMMIT}&status=completed&per_page=100" > /tmp/runs.json
          jq -e '.workflow_runs | any(.name == "RamaVerse Quality Gate" and .head_sha == env.ROLLBACK_TARGET_COMMIT and .conclusion == "success")' /tmp/runs.json >/dev/null || {
            echo "Rollback target has no successful RamaVerse Quality Gate evidence."
            exit 1
          }

      - name: Verify target Preview Deployment Preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.workflow_runs | any(.name == "RamaVerse Preview Deployment Preflight" and .head_sha == env.ROLLBACK_TARGET_COMMIT and .conclusion == "success")' /tmp/runs.json >/dev/null || {
            echo "Rollback target has no successful Preview Deployment Preflight evidence."
            exit 1
          }

      - name: Verify target Preview Release Candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.workflow_runs | any(.name == "RamaVerse Preview Release Candidate" and .head_sha == env.ROLLBACK_TARGET_COMMIT and .conclusion == "success")' /tmp/runs.json >/dev/null || {
            echo "Rollback target has no successful Preview Release Candidate evidence."
            exit 1
          }

      - name: Create rollback readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rollback-evidence
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg current_deployed_commit "${CURRENT_DEPLOYED_COMMIT,,}" \
            --arg rollback_target_commit "${ROLLBACK_TARGET_COMMIT,,}" \
            --arg provider_candidate "$PROVIDER_CANDIDATE" \
            --arg rollback_reason "$ROLLBACK_REASON" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            '{
              schema_version: 1,
              result: "PREVIEW_ROLLBACK_READY",
              repository: $repository,
              current_deployed_commit: $current_deployed_commit,
              rollback_target_commit: $rollback_target_commit,
              provider_candidate: $provider_candidate,
              rollback_reason: $rollback_reason,
              owner_rollback_approval: true,
              target_is_ancestor: true,
              target_quality_gate_passed: true,
              target_preview_preflight_passed: true,
              target_preview_rc_passed: true,
              preview_scope_only: true,
              execution_performed: false,
              production_ready: false,
              production_dns_change_allowed: false,
              production_deployment_change_allowed: false,
              workflow_run_id: $workflow_run_id
            }' > rollback-evidence/preview-rollback-readiness.json
          jq -e '.result == "PREVIEW_ROLLBACK_READY" and .execution_performed == false and .preview_scope_only == true and .production_ready == false and .production_dns_change_allowed == false and .production_deployment_change_allowed == false' rollback-evidence/preview-rollback-readiness.json >/dev/null

      - name: Upload rollback readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: preview-rollback-readiness-${{ inputs.rollback_target_commit }}
          path: rollback-evidence/preview-rollback-readiness.json
          if-no-files-found: error
          retention-days: 30
