services:
  - type: web
    name: ramaverse-hitech-preview
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: corepack enable && corepack prepare pnpm@10.4.1 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_APP_ID
        value: ramaverse
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_EXPECTED_NAME
        value: ramaverse_preview
      - key: RAMAVERSE_PREVIEW_DATABASE_HOST
        sync: false
      - key: DATABASE_CA_CERT_B64
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VITE_OIDC_AUTHORIZATION_URL
        sync: false
      - key: VITE_OIDC_CLIENT_ID
        sync: false
      - key: VITE_OIDC_SCOPES
        value: openid profile email
      - key: OIDC_AUTHORIZATION_URL
        sync: false
      - key: OIDC_TOKEN_URL
        sync: false
      - key: OIDC_USERINFO_URL
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_SCOPES
        value: openid profile email
      - key: OIDC_PROVIDER_NAME
        value: google
