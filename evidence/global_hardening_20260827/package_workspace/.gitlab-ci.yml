image: node:22-bookworm

stages:
  - verify
  - build
  - artifact

variables:
  PNPM_HOME: /root/.local/share/pnpm
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

before_script:
  - corepack enable
  - pnpm install --frozen-lockfile

verify:
  stage: verify
  script:
    - pnpm test
    - pnpm check
    - pnpm lint
    - test -f client/public/robots.txt
    - test -f client/public/sitemap.xml
    - test -f client/public/manifest.json
    - test -f client/public/sw.js
    - node scripts/validate_global_hardening.mjs

build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

source-handoff:
  stage: artifact
  script:
    - mkdir -p release
    - tar --exclude=node_modules --exclude=.git --exclude=dist --exclude='*.zip' -czf release/ramaverse-source.tar.gz .
  artifacts:
    paths:
      - release/ramaverse-source.tar.gz
    expire_in: 30 days
