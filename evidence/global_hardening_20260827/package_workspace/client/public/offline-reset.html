<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b14" />
    <title>RamaVerse · Offline reset</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#070b14; color:#f3e9d2; }
      body { min-height:100vh; display:grid; place-items:center; margin:0; background:radial-gradient(circle at 50% 10%,#182a4d,#070b14 60%); }
      main { width:min(90vw,34rem); padding:2rem; border:1px solid #d7b45a55; border-radius:1.25rem; background:#0d1524ee; box-shadow:0 1.5rem 5rem #0008; text-align:center; }
      h1 { color:#f4d98b; font-family: Georgia, serif; font-weight:500; letter-spacing:.04em; }
      p { color:#f3e9d2bb; line-height:1.7; }
      button { border:0; border-radius:999px; padding:.8rem 1.2rem; background:#d7b45a; color:#070b14; font-weight:700; cursor:pointer; }
      button:focus-visible { outline:2px solid #f4d98b; outline-offset:3px; }
    </style>
  </head>
  <body>
    <main>
      <div aria-hidden="true" style="font-size:2rem">ॐ</div>
      <h1>Return to the RamaVerse</h1>
      <p>If the offline shell is out of date, clear its local cache and reopen the site. Your private library data is not changed by this reset.</p>
      <button id="reset" type="button">Reset offline shell</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const status = document.getElementById("status");
      document.getElementById("reset").addEventListener("click", async () => {
        if (navigator.serviceWorker?.controller) navigator.serviceWorker.controller.postMessage({ type: "CLEAR_CACHE" });
        if (window.caches) for (const key of await caches.keys()) await caches.delete(key);
        status.textContent = "Offline shell reset. Returning home…";
        setTimeout(() => location.href = "/", 500);
      });
    </script>
  </body>
</html>
